  ubuntu-server-preinstalled-arm64+raspi:
    serial: "20261012"
    publishing_command: ARCHES='arm64+raspi' for-project ubuntu publish-release ubuntu-server/daily-preinstalled SERIAL preinstalled-server named MILESTONE_SLUG
  ubuntu-server-preinstalled-riscv64:
    serial: "20261012.1"
    publishing_command: ARCHES='riscv64' for-project ubuntu publish-release ubuntu-server/daily-preinstalled SERIAL preinstalled-server named MILESTONE_SLUG
  ubuntu-server-live-amd64:
    serial: "20261010"
    publishing_command: ARCHES='amd64' for-project ubuntu publish-release ubuntu-server/daily-live SERIAL live-server yes MILESTONE_SLUG
  ubuntu-server-live-arm64:
