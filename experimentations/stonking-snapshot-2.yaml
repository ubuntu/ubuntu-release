  xubuntu-minimal-amd64:
    serial: "20260623"
    publishing_command: ARCHES='amd64' for-project xubuntu publish-release daily-minimal SERIAL minimal named MILESTONE_SLUG
  # New for stonking snapshot 2: xubuntu minimal on riscv64.
  xubuntu-minimal-riscv64:
    serial: "20260623"
    publishing_command: ARCHES='riscv64' for-project xubuntu publish-release daily-minimal SERIAL minimal named MILESTONE_SLUG
