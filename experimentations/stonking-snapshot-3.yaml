milestone:
  name: Snapshot 3
  # Nest milestones under a 'release/' parent so they land at
  # <project>/releases/stonking/release/snapshot-3/ (matching the standard
  # releases/<series>/release/ layout) instead of directly under
  # releases/stonking/. The 'release/' prefix is consumed as the publish
  # 'status' (the trailing arg to publish-release), which becomes the target
  # directory; see cdimage FullReleasePublisher.target_dir.
  #
  # The leaf ('snapshot-3') is also the filename tag, so images publish as
  # e.g. kubuntu-26.10-snapshot3-desktop-amd64.iso. Only an exact 'release'
  # leaf is untagged; see publish_release_prefixes().
  slug: release/snapshot-3
images:
  edubuntu-amd64:
    serial: "20260903"
    publishing_command: ARCHES='amd64' for-project edubuntu publish-release daily-live SERIAL desktop named MILESTONE_SLUG
  # Stale: newest arm64+raspi preinstalled build is from 2026-07-06, ~2 months
  # old, so the raspi dailies have been failing. Same for ubuntu-desktop below.
  edubuntu-arm64+raspi:
    serial: "20260706"
    publishing_command: ARCHES='arm64+raspi' for-project edubuntu publish-release daily-preinstalled SERIAL preinstalled-desktop named MILESTONE_SLUG
  kubuntu-amd64:
    serial: "20260903"
    publishing_command: ARCHES='amd64' for-project kubuntu publish-release daily-live SERIAL desktop named MILESTONE_SLUG
  lubuntu-amd64:
